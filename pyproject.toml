[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drive-backup"
version = "0.1.0"
description = "Push new and changed files from chosen folders to Google Drive, keeping every version."
requires-python = ">=3.11"
dependencies = [
  "watchdog>=4",
  "google-api-python-client>=2.100",
  "google-auth>=2.23",
  "google-auth-oauthlib>=1.1",
  "platformdirs>=4",
  "PySide6>=6.6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
drive-backup = "drive_backup.cli:gui_main"
drive-backup-service = "drive_backup.cli:service_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
